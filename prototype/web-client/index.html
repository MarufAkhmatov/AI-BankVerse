<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI BankVerse</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="loading-screen">
        <div id="loading-text">Entering AI BankVerse&hellip;</div>
      </div>

      <div id="hud">
        <div id="interaction-prompt" class="hidden"></div>
        <div id="mic-indicator" class="hidden">● Listening</div>
      </div>

      <div id="conversation-panel" class="panel hidden"></div>
      <div id="service-panel" class="panel hidden"></div>
      <div id="receipt-panel" class="panel hidden"></div>

      <form id="text-input-bar" autocomplete="off">
        <input id="text-input" type="text" placeholder="Reception bilan gaplashing... (masalan: Elektr energiyasiga to'lov qilmoqchiman)" />
        <button type="submit">Yubor</button>
        <button type="button" id="mic-button" title="Mikrofon">🎤</button>
      </form>

      <div id="mobile-joystick" class="hidden">
        <div id="mobile-joystick-base"><div id="mobile-joystick-knob"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
